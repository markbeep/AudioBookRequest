services:
  # chaptarr requires 1000:1000 dir perms, but also nice to have the config dir owned by the user
  init:
    profiles: [local]
    image: alpine
    user: "0:0"
    volumes:
      - ./data:/data
      - ./config:/config
    command: chown -R 1000:1000 /data /config

  web:
    # start with `docker-compose --profile local up`
    profiles: [local]
    environment:
      # a fresh clone has no config DB; initialize the root login the setup script expects
      ABR_APP__INIT_ROOT_USERNAME: ${ABR_APP__INIT_ROOT_USERNAME:-a}
      ABR_APP__INIT_ROOT_PASSWORD: ${ABR_APP__INIT_ROOT_PASSWORD:-a}
    build:
      context: .
      args:
        - VERSION=local
    volumes:
      - ./config:/config
    ports:
      - "8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully

  psql:
    image: postgres:17
    environment:
      POSTGRES_USER: abr
      POSTGRES_PASSWORD: password
      POSTGRES_DB: audiobookrequest
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    depends_on:
      init:
        condition: service_completed_successfully

  prowlarr:
    profiles: [local]
    image: lscr.io/linuxserver/prowlarr:latest
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/prowlarr:/config
    ports:
      - "9696:9696"
    depends_on:
      init:
        condition: service_completed_successfully

  chaptarr:
    profiles: [local]
    image: chaptarr/chaptarr:latest
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/chaptarr:/config
      - ./data/audiobooks:/audiobooks
      - ./data/downloads:/downloads
    ports:
      - "8789:8789"
    depends_on:
      init:
        condition: service_completed_successfully

  qbittorrent:
    profiles: [local]
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      WEBUI_PORT: 8081
      TORRENTING_PORT: 6881
    volumes:
      - ./data/qbittorrent:/config
      - ./data/downloads:/downloads
    ports:
      - "8081:8081"
      - "6881:6881"
      - "6881:6881/udp"
    depends_on:
      init:
        condition: service_completed_successfully
