[project]
name = "AudioBookRequest"
version = "1.10.7"
requires-python = ">= 3.14"
readme = "README.md"
dependencies = [
    "aiohttp>=3.14.5",
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "argon2-cffi>=25.1.0",
    "argon2-cffi-bindings>=26.1.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.147.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "jinja2-fragments>=1.12.0",
    "jinja2-htmlmin>=1.1.0",
    "jinjax>=0.66",
    "markdown>=3.11.1",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "pydantic-core>=2.50.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "sqlmodel>=0.0.48",
    "structlog>=26.1.0",
    "terminaltables>=3.1.10",
    "torf>=4.3.1",
    "torrent-parser>=0.4.1",
    "typer>=0.27.3",
    "urllib3>=2.8.0",
]

# setuptools by default expects a "src" folder structure
[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
package = false

[tool.djlint]
profile = "django"
ignore = "H021"
format_js=true
line_break_after_multiline_tag=true
max_blank_lines=1
# NOTE: custom_html formats documents, but also adds quotes around attributes breaking jinjax
# custom_html="BaseLayout,Index.PopularSection,BookCard"
ignore_case=true




[tool.basedpyright]
typeCheckingMode = "all"
include = ["app", "tests"]
reportDeprecated = false
reportUnusedCallResult = false
allowedUntypedLibraries = ["apscheduler", "torrent_parser", "jinjax"]

[tool.ruff.lint]
# External service calls intentionally degrade to fallbacks on any error.
ignore = ["BLE001"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    # 1.45+ quotes unquoted Jinjax props (users={{ users }}), turning typed args into strings.
    "djlint==1.42.1",
    "httpx2>=2.14.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
